services:
  postgres:
    image: postgres:16-alpine
    container_name: degust-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: degust
      POSTGRES_PASSWORD: degust_dev_pass
      POSTGRES_DB: degust_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U degust -d degust_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
